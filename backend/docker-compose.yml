services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neuromind
      POSTGRES_USER: neuromind
      POSTGRES_PASSWORD: neuromind
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuromind -d neuromind"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://neuromind:neuromind@postgres:5432/neuromind
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../storage:/app/storage
      - ../ai_models:/app/ai_models
      - ../knowledge_base:/app/knowledge_base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
