name: NeuroMind CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run lint
      - run: npm run build
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/neuromind_ci.sqlite
          JWT_SECRET_KEY: ci-only-secret-key-longer-than-thirty-two-characters
          INITIAL_ADMIN_PASSWORD: CI-Admin-Password-123!
        run: python -m pytest -q
      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/neuromind_migration_ci.sqlite
          JWT_SECRET_KEY: ci-only-secret-key-longer-than-thirty-two-characters
          INITIAL_ADMIN_PASSWORD: CI-Admin-Password-123!
        run: python -m alembic upgrade head
