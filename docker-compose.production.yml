services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.6.3
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - object_data:/data
    # The MinIO server image is not assumed to contain the mc client. Readiness
    # is checked by the dedicated minio/mc init container below.
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -eu;
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      attempt=0;
      until mc ready local; do
        attempt=$$((attempt + 1));
        if [ "$$attempt" -ge 60 ]; then echo 'MinIO did not become ready in time'; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/neuromind
    restart: "no"

  model-artifacts:
    build:
      context: ./backend
    environment:
      MODEL_BUNDLE_URL: ${MODEL_BUNDLE_URL:?Set MODEL_BUNDLE_URL in .env.production.compose}
      MODEL_BUNDLE_SHA256: ${MODEL_BUNDLE_SHA256:?Set MODEL_BUNDLE_SHA256 in .env.production.compose}
      MODEL_BUNDLE_BEARER_TOKEN: ${MODEL_BUNDLE_BEARER_TOKEN:-}
      MODEL_BUNDLE_TARGET_DIR: /app/ai_models
    volumes:
      - model_data:/app/ai_models
    command: ["python", "scripts/fetch_model_bundle.py"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuromind}
      POSTGRES_USER: ${POSTGRES_USER:-neuromind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_DOCS_ENABLED: "false"
      AUTH_RETURN_TOKENS: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neuromind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuromind}
      FRONTEND_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      CLERK_AUTHORIZED_PARTIES: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      RATE_LIMIT_ENABLED: "true"
      TASK_QUEUE_MODE: celery
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      STORAGE_BACKEND: s3
      S3_BUCKET: neuromind
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      model-artifacts:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/storage
      - model_data:/app/ai_models:ro
      - ./knowledge_base:/app/knowledge_base:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file: ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neuromind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuromind}
      TASK_QUEUE_MODE: celery
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      STORAGE_BACKEND: s3
      S3_BUCKET: neuromind
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
      FRONTEND_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      CLERK_AUTHORIZED_PARTIES: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      model-artifacts:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/storage
      - model_data:/app/ai_models:ro
      - ./knowledge_base:/app/knowledge_base:ro
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=${AI_WORKER_CONCURRENCY:-1}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ENABLE_CLERK: "true"
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  chroma_data:
  redis_data:
  object_data:
  model_data:
